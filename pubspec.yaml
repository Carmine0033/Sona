name: media_overlay
description: "Sona: a vinyl-style now-playing card and media controller for Windows."
publish_to: 'none'
version: 0.1.8+11

environment:
  sdk: ^3.13.5

dependencies:
  ffi: ^2.2.0
  file_selector: ^1.0.3
  flutter:
    sdk: flutter
  flutter_localizations:  
    sdk: flutter
  intl: any
  flutter_colorpicker: ^1.1.0
  flutter_riverpod: ^3.4.3
  http: ^1.6.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  win32: ^6.4.0
  window_manager: ^0.5.2
  media_kit: ^1.2.6
  media_kit_libs_windows_audio: ^1.0.9
  youtube_explode_dart: ^3.1.0
  screen_retriever: ^0.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/whats_new.json
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: Inter
      fonts: 
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600









